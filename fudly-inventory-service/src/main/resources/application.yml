server:
  port: 0
spring:
  application:
    name: fudly-inventory-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/fudly
  datasource:
    url: jdbc:postgresql://localhost:5432/inventory_db
    username: postgres
    password: postgres
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yml
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        spring.json.add.type.headers: false
    consumer:
      group-id: inventory-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.trusted.packages: com.walking.*
        spring.json.value.default.type: com.walking.inventory.application.event.EventEnvelope
        spring.json.use.type.headers: false
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

app:
  kafka:
    partitions: 3
    replicas: 1
    topics:
      inventory: inventory-events
      listing: listing-events
    outbox:
      batch-size: 100
      fixed-delay-ms: 1000
      requeue-delay-ms: 30000
      lease-time-minutes: 1
    consumers:
      listing-status-sync: inventory-service.listing-status-sync
  reservation:
    ttl-minutes: 10
    expiration-delay-ms: 60000